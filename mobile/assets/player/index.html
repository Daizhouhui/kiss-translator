<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Kiss Player</title>
<style>
  :root {
    --bg: #F7F5F0;
    --bg-elevated: #FBF9F5;
    --surface: #FFFFFF;
    --surface-alt: #F1EDE5;
    --text: #15131A;
    --text-secondary: #6E6878;
    --text-tertiary: #9B95A6;
    --primary: #6C4DF6;
    --primary-soft: #EDE7FF;
    --primary-deep: #5336D9;
    --border: #E8E2D8;
    --danger: #E5484D;
    --shadow: 0 12px 36px rgba(26, 20, 38, 0.10);
    --sub-size: 20px;
    --sub-bg: rgba(12, 10, 16, 0.55);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"] {
    --bg: #0F0D14;
    --bg-elevated: #131019;
    --surface: #18151F;
    --surface-alt: #211C2B;
    --text: #F7F3FF;
    --text-secondary: #A7A0B6;
    --text-tertiary: #7B748C;
    --primary: #8B72FF;
    --primary-soft: #2A2142;
    --primary-deep: #6C4DF6;
    --border: #2B2537;
    --danger: #FF6B6E;
    --shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  button { font-family: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
  #root { position: relative; display: flex; flex-direction: column; height: 100%; width: 100%; }

  .topbar {
    height: calc(52px + var(--safe-top));
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: var(--safe-top) 8px 0 4px;
    background: var(--bg);
    z-index: 10;
  }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 21px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--text-secondary);
    transition: background .18s ease, transform .18s ease;
  }
  .icon-btn:active { transform: scale(.94); background: var(--surface-alt); }
  .icon-btn.fav-on { color: var(--primary); }
  .topbar .title {
    flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar .title .sub {
    display: block; font-size: 11px; font-weight: 400; color: var(--text-tertiary);
    margin-top: 1px;
  }
  .top-actions { display: flex; align-items: center; gap: 2px; }

  .stage { padding: 0 14px; flex: 0 0 auto; }
  .video-shell {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 18px; overflow: hidden; background: #050407;
    box-shadow: var(--shadow);
    transform: translateZ(0);
  }
  #player, #player iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
  .video-shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.18) 0%, transparent 22%, transparent 70%, rgba(0,0,0,.34) 100%); }

  .subtitle-overlay {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 10px; width: 92%; text-align: center; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    opacity: 0; transition: opacity .2s ease;
  }
  .subtitle-overlay.visible { opacity: 1; }
  .subtitle-overlay.top { bottom: auto; top: 10px; }
  .sub-original, .sub-translation {
    display: inline-block; max-width: 100%;
    padding: 4px 10px; border-radius: 8px;
    background: var(--sub-bg);
    color: #FFFFFF;
    line-height: 1.35;
    text-shadow: 0 2px 8px rgba(0,0,0,.55);
    -webkit-backdrop-filter: blur(2px);
  }
  .sub-original { font-size: calc(var(--sub-size) * .82); opacity: .94; }
  .sub-translation { font-size: var(--sub-size); font-weight: 600; }
  .mode-original .sub-translation { display: none; }
  .mode-translation .sub-original { display: none; }

  .video-loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #050407; color: rgba(255,255,255,.85); z-index: 3;
    font-size: 13px; letter-spacing: .4px;
  }
  body[data-orientation="landscape"] .video-loading { display: none; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin 1s linear infinite; margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .video-error {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #241F30, #050407 70%); z-index: 4;
    padding: 18px; text-align: center;
  }
  .video-error.show { display: flex; }
  .video-error .box { max-width: 280px; color: #F5F2FF; }
  .video-error .title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .video-error .desc { font-size: 12px; color: rgba(245,242,255,.66); line-height: 1.5; margin-bottom: 12px; }
  .video-error .action {
    display: inline-block; padding: 8px 14px; border-radius: 999px;
    background: var(--primary); color: #fff; font-size: 12px; font-weight: 700;
  }

  .stage-meta {
    height: 34px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px; color: var(--text-tertiary); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .stage-meta .actions { display: flex; gap: 2px; }
  .stage-meta .actions .icon-btn { width: 34px; height: 34px; font-size: 16px; }

  .transcript {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: 4px 20px 18px; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .transcript::-webkit-scrollbar { display: none; }
  .cue { padding: 9px 0 10px; transition: opacity .2s ease; cursor: pointer; }
  .cue .orig {
    font-size: calc(var(--sub-size) * .85); line-height: 1.42; font-weight: 500;
    color: var(--text-tertiary);
    transition: color .2s ease;
  }
  .cue .trans {
    margin-top: 5px; font-size: calc(var(--sub-size) * .70); line-height: 1.5; color: var(--text-tertiary);
    opacity: .9; transition: color .2s ease, opacity .2s ease;
  }
  .cue.past { opacity: .62; }
  .cue.active .orig {
    color: var(--primary); font-weight: 700;
    text-decoration: underline; text-decoration-color: var(--primary);
    text-decoration-thickness: 2px; text-underline-offset: 4px;
  }
  .cue.active .trans { color: var(--text); font-weight: 500; opacity: 1; }
  .cue.active { transform: translateZ(0); }
  .empty-cues { padding: 26px 8px; text-align: center; color: var(--text-tertiary); font-size: 13px; line-height: 1.7; }

  .controls {
    flex: 0 0 auto; background: var(--surface);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -10px 30px rgba(20, 15, 30, .08);
    padding: 10px 16px calc(8px + var(--safe-bottom));
    z-index: 12;
  }
  .progress-row { padding: 4px 2px 0; }
  .progress-track {
    position: relative; height: 22px; display: flex; align-items: center; cursor: pointer;
  }
  .progress-track .rail {
    position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px;
    background: var(--border); overflow: hidden;
  }
  .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: var(--primary); border-radius: 2px;
  }
  .progress-thumb {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: var(--primary); transform: translateX(-50%);
    box-shadow: 0 0 0 4px var(--primary-soft);
    left: 0; transition: transform .1s ease;
  }
  .time-row {
    display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-tertiary);
    font-variant-numeric: tabular-nums; padding: 0 2px 2px;
  }
  .landscape-controls { display: none; }
  .landscape-controls button {
    width: 34px; height: 30px; border-radius: 9px; color: rgba(255,255,255,.9);
    font-size: 13px; display: inline-flex; align-items: center; justify-content: center;
  }
  .landscape-controls button:active { background: rgba(255,255,255,.12); }
  .transport-row {
    display: flex; align-items: center; justify-content: center;
    padding: 4px 6px 2px; gap: 24px;
  }
  .transport-spacer { width: 46px; height: 1px; }
  .speed-pill {
    min-width: 46px; height: 32px; border-radius: 16px; background: var(--surface-alt);
    color: var(--text-secondary); font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .transport-row .icon-btn { width: 46px; height: 46px; font-size: 19px; color: var(--text-secondary); }
  .play-btn {
    width: 58px; height: 58px; border-radius: 50%;
    background: linear-gradient(145deg, #8B72FF, var(--primary-deep));
    color: #fff; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(108, 77, 246, .35);
    transition: transform .16s ease;
  }
  .play-btn:active { transform: scale(.94); }
  .play-btn svg { width: 24px; height: 24px; }
  .bottom-actions {
    display: flex; align-items: center; justify-content: space-around;
    padding: 6px 8px 2px;
  }
  .bottom-actions .action {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-tertiary); font-size: 10px; min-width: 52px;
  }
  .bottom-actions .action .glyph {
    width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; background: transparent;
  }
  .bottom-actions .action.active { color: var(--primary); }
  .bottom-actions .action.active .glyph { background: var(--primary-soft); }

  .landscape-extra { display: none; }

  .sheet-mask {
    position: absolute; inset: 0; background: rgba(8, 6, 14, .5);
    display: none; align-items: flex-end; z-index: 40;
    -webkit-backdrop-filter: blur(2px);
  }
  .sheet-mask.open { display: flex; }
  .sheet-card {
    width: 100%; max-height: 82%; overflow-y: auto;
    background: var(--surface); border-radius: 26px 26px 0 0;
    padding: 10px 20px calc(22px + var(--safe-bottom));
    box-shadow: 0 -20px 50px rgba(0,0,0,.28);
    animation: sheetUp .24s ease;
  }
  @keyframes sheetUp { from { transform: translateY(16px); opacity: .7; } to { transform: translateY(0); opacity: 1; } }
  .sheet-grabber { width: 38px; height: 4px; border-radius: 2px; background: var(--border); margin: 4px auto 14px; }
  .sheet-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .sheet-desc { font-size: 12px; color: var(--text-tertiary); line-height: 1.5; margin-bottom: 18px; }
  .setting-block { margin-bottom: 20px; }
  .setting-label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .setting-label .value { color: var(--text-tertiary); font-weight: 500; font-size: 12px; }
  .segmented { display: flex; gap: 8px; }
  .segmented button { flex: 1; height: 40px; border-radius: 12px; background: var(--surface-alt); color: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .segmented button.active { background: var(--primary); color: #fff; }
  input[type="range"] { width: 100%; accent-color: var(--primary); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 13px; }
  .switch-row span { color: var(--text); }
  .switch { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--border); transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .switch.on { background: var(--primary); }
  .switch.on::after { left: 21px; }
  .sheet-close { width: 100%; height: 46px; border-radius: 14px; background: var(--surface-alt); color: var(--text); font-size: 14px; font-weight: 700; margin-top: 4px; }

  .menu-mask { position: absolute; inset: 0; display: none; z-index: 30; }
  .menu-mask.open { display: block; }
  .menu-card {
    position: absolute; right: 12px; top: 52px; width: 210px;
    background: var(--surface); border-radius: 18px; padding: 8px;
    box-shadow: 0 18px 50px rgba(0,0,0,.26);
    animation: menuIn .18s ease;
  }
  @keyframes menuIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; border-radius: 12px; font-size: 13px; color: var(--text); width: 100%; text-align: left; }
  .menu-item:active { background: var(--surface-alt); }
  .menu-item .hint { font-size: 11px; color: var(--text-tertiary); }
  .menu-sep { height: 1px; background: var(--border); margin: 6px 10px; }

  .toast {
    position: absolute; left: 50%; bottom: calc(96px + var(--safe-bottom)); transform: translateX(-50%) translateY(8px);
    background: rgba(18, 14, 26, .88); color: #fff; font-size: 12px; padding: 9px 14px;
    border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 60; max-width: 80%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .loading-skeleton { position: absolute; inset: 0; z-index: 3; background: #0B0910; overflow: hidden; }
  .loading-skeleton::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { from { left: -40%; } to { left: 100%; } }

  body[data-orientation="landscape"] .portrait-only { display: none !important; }
  body[data-orientation="landscape"] .topbar { display: none; }
  body[data-orientation="landscape"] .stage { position: absolute; inset: 0; padding: 0; }
  body[data-orientation="landscape"] .video-shell { height: 100%; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
  body[data-orientation="landscape"] .stage-meta { display: none; }
  body[data-orientation="landscape"] .transcript { display: none; }
  body[data-orientation="landscape"] .controls {
    position: absolute; top: 0; left: 0; right: 0; bottom: auto;
    background: linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,.18) 52%, transparent);
    box-shadow: none; border-radius: 0; color: #fff;
    padding: calc(8px + var(--safe-top)) 20px 0;
  }
  body[data-orientation="landscape"] .time-row { color: rgba(255,255,255,.86); padding: 0 2px; }
  body[data-orientation="landscape"] .landscape-controls { display: flex; align-items: center; gap: 2px; }
  body[data-orientation="landscape"] .progress-track { height: 18px; }
  body[data-orientation="landscape"] .progress-track .rail { height: 3px; background: rgba(255,255,255,.24); }
  body[data-orientation="landscape"] .progress-fill { background: rgba(255,255,255,.92); }
  body[data-orientation="landscape"] .progress-thumb { width: 10px; height: 10px; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
  body[data-orientation="landscape"] .transport-row { display: none; }
  body[data-orientation="landscape"] .bottom-actions { display: none; }
  body[data-orientation="landscape"] .landscape-extra { display: flex; }
  body[data-orientation="landscape"] .subtitle-overlay {
    bottom: 7%; width: auto; max-width: 86%; min-width: 30%;
    padding: 8px 16px; border-radius: 9px; background: rgba(0,0,0,.55);
    -webkit-backdrop-filter: blur(2px);
  }
  body[data-orientation="landscape"] .sub-original,
  body[data-orientation="landscape"] .sub-translation {
    background: transparent; padding: 0; text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  body[data-orientation="landscape"] .sub-original { font-size: calc(var(--sub-size) * .82); color: rgba(255,255,255,.94); }
  body[data-orientation="landscape"] .sub-translation { color: #fff; font-weight: 500; }
  body[data-orientation="landscape"] .sheet-card { border-radius: 24px; max-width: 520px; margin: 0 auto 18px; max-height: 76%; }
  body[data-orientation="landscape"] .sheet-mask { align-items: center; }

  .center-transport {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: none; align-items: center; gap: 26px; z-index: 8;
  }
  body[data-orientation="landscape"] .center-transport { display: flex; }
  .center-transport button {
    width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,.42);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 18px; -webkit-backdrop-filter: blur(4px);
  }
  .center-transport .center-play {
    width: 68px; height: 68px; font-size: 22px;
    background: linear-gradient(145deg, #8B72FF, #5336D9);
  }
  .center-transport.hidden { opacity: 0; pointer-events: none; }
  .center-transport { transition: opacity .25s ease; }

  @media (max-height: 620px) {
    .video-shell { border-radius: 14px; }
    .transcript { padding-top: 0; }
    .controls { padding-top: 6px; }
  }
</style>
</head>
<body>
<div id="root">
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="back">&#8592;</button>
    <div class="title" id="title">正在加载…<span class="sub" id="subTitle"></span></div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" aria-label="theme">&#10022;</button>
      <button class="icon-btn" id="menuBtn" aria-label="menu">&#8943;</button>
    </div>
  </header>

  <section class="stage">
    <div class="video-shell">
      <div id="player"></div>
      <div class="video-shade"></div>
      <div class="subtitle-overlay" id="subtitleOverlay">
        <div class="sub-original" id="subOriginal"></div>
        <div class="sub-translation" id="subTranslation"></div>
      </div>
      <div class="video-loading" id="loading"><span class="spinner"></span>正在准备播放器…</div>
      <div class="video-error" id="errorBox">
        <div class="box">
          <div class="title" id="errorTitle">视频无法播放</div>
          <div class="desc" id="errorDesc">该视频可能不允许嵌入播放，或当前网络无法访问 YouTube。</div>
          <button class="action" id="openExternalBtn">在 YouTube 打开</button>
        </div>
      </div>
    </div>
    <div class="stage-meta portrait-only">
      <span id="currentTimeLabel">0:00</span>
      <div class="actions">
        <button class="icon-btn" id="quickModeBtn" aria-label="mode">&#10022;</button>
        <button class="icon-btn" id="favoriteBtn" aria-label="favorite">&#9825;</button>
      </div>
    </div>
  </section>

  <main class="transcript portrait-only" id="transcript">
    <div id="transcriptInner"></div>
  </main>

  <div class="center-transport landscape-extra" id="centerTransport">
    <button id="centerPrev" aria-label="previous">&#9198;</button>
    <button class="center-play" id="centerPlay" aria-label="play">&#9654;</button>
    <button id="centerNext" aria-label="next">&#9197;</button>
  </div>

  <footer class="controls">
    <div class="progress-row">
      <div class="progress-track" id="progressTrack">
        <div class="rail"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
    </div>
    <div class="time-row">
      <span id="timeNow">0:00</span>
      <div class="landscape-controls">
        <button id="ccBtn" aria-label="subtitles">CC</button>
        <button id="favBtn" aria-label="favorite">&#9825;</button>
        <button id="exitFullBtn" aria-label="exit fullscreen">&#10530;</button>
      </div>
      <span id="timeTotal">0:00</span>
    </div>
    <div class="transport-row">
      <div class="transport-spacer"></div>
      <button class="icon-btn" id="prevBtn" aria-label="previous">&#9198;</button>
      <button class="play-btn" id="playBtn" aria-label="play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l10-6.5-10-6.5z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="nextBtn" aria-label="next">&#9197;</button>
      <div class="transport-spacer"></div>
    </div>
    <div class="bottom-actions">
      <button class="action" id="modeAction"><span class="glyph">&#10022;</span><span>双语</span></button>
      <button class="action" id="styleAction"><span class="glyph">Aa</span><span>字幕样式</span></button>
      <button class="action" id="speedAction"><span class="glyph" id="speedGlyph">1.0x</span><span>倍速</span></button>
      <button class="action" id="fullAction"><span class="glyph">&#9974;</span><span>全屏</span></button>
    </div>
  </footer>
</div>

<div class="sheet-mask" id="sheetMask">
  <div class="sheet-card">
    <div class="sheet-grabber"></div>
    <div class="sheet-title">字幕样式</div>
    <div class="sheet-desc">调整后会立即应用到播放器，并同步到 App 设置。</div>

    <div class="setting-block">
      <div class="setting-label"><span>显示模式</span><span class="value" id="modeValue">双语</span></div>
      <div class="segmented" id="modeSegmented">
        <button data-mode="bilingual">原文 + 译文</button>
        <button data-mode="translation">仅译文</button>
        <button data-mode="original">仅原文</button>
      </div>
    </div>

    <div class="setting-block">
      <div class="setting-label"><span>字号</span><span class="value" id="fontValue">20px</span></div>
      <input type="range" id="fontRange" min="16" max="28" step="1" />
    </div>

    <div class="setting-block">
      <div class="setting-label"><span>背景不透明度</span><span class="value" id="opacityValue">55%</span></div>
      <input type="range" id="opacityRange" min="0" max="90" step="5" />
    </div>

    <div class="setting-block">
      <div class="setting-label"><span>位置</span><span class="value" id="positionValue">底部</span></div>
      <div class="segmented" id="positionSegmented">
        <button data-pos="bottom">底部</button>
        <button data-pos="top">顶部</button>
      </div>
    </div>

    <div class="setting-block">
      <div class="switch-row"><span>视频上显示字幕</span><button class="switch" id="showOnVideoSwitch"></button></div>
      <div class="switch-row"><span>竖屏显示逐句稿</span><button class="switch" id="transcriptSwitch"></button></div>
    </div>

    <button class="sheet-close" id="sheetClose">完成</button>
  </div>
</div>

<div class="menu-mask" id="menuMask">
  <div class="menu-card">
    <button class="menu-item" data-menu="quality">画质 <span class="hint" id="qualityHint">自动</span></button>
    <button class="menu-item" data-menu="speed">播放速度 <span class="hint" id="speedHint">1.0x</span></button>
    <button class="menu-item" data-menu="translate">重新翻译字幕 <span class="hint">&#10022;</span></button>
    <div class="menu-sep"></div>
    <button class="menu-item" data-menu="external">在 YouTube 打开 <span class="hint">&#8599;</span></button>
    <button class="menu-item" data-menu="copy">复制视频链接 <span class="hint">&#128203;</span></button>
    <div class="menu-sep"></div>
    <button class="menu-item" data-menu="sleep">睡眠定时 <span class="hint" id="sleepHint">关闭</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var state = {
    videoId: '',
    title: '',
    author: '',
    cues: [],
    activeIndex: -1,
    duration: 0,
    current: 0,
    playing: false,
    rate: 1,
    quality: 'default',
    sleepAt: 0,
    prefs: {
      fontSize: 20,
      mode: 'bilingual',
      position: 'bottom',
      backgroundOpacity: 0.55,
      showOnVideo: true,
      transcript: true
    },
    theme: 'light',
    userScrollAt: 0,
    programmaticScrollUntil: 0,
    lastSent: -1,
    pendingLoad: false,
    orientation: 'portrait'
  };

  var player = null;
  var ytReady = false;
  var apiTimer = null;

  function $(id) { return document.getElementById(id); }
  function send(payload) {
    if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
      window.ReactNativeWebView.postMessage(JSON.stringify(payload));
    }
  }
  function formatTime(seconds) {
    if (!isFinite(seconds) || seconds < 0) seconds = 0;
    var total = Math.floor(seconds);
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    return m + ':' + String(s).padStart(2, '0');
  }
  var toastTimer = null;
  function toast(text) {
    var el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  function applyTheme(theme) {
    state.theme = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', state.theme);
    $('themeBtn').textContent = state.theme === 'dark' ? '\u2600' : '\u2726';
  }

  function syncOrientation() {
    state.orientation = window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
    document.body.setAttribute('data-orientation', state.orientation);
    updateSubtitleOverlay();
    send({ type: 'orientation', value: state.orientation });
  }

  function applyPrefs() {
    var prefs = state.prefs;
    document.documentElement.style.setProperty('--sub-size', prefs.fontSize + 'px');
    document.documentElement.style.setProperty('--sub-bg', 'rgba(12,10,16,' + prefs.backgroundOpacity + ')');
    var overlay = $('subtitleOverlay');
    overlay.classList.toggle('top', prefs.position === 'top');
    overlay.classList.toggle('mode-original', prefs.mode === 'original');
    overlay.classList.toggle('mode-translation', prefs.mode === 'translation');
    $('transcript').style.display = prefs.transcript ? '' : 'none';
    $('modeValue').textContent = prefs.mode === 'bilingual' ? '双语' : prefs.mode === 'translation' ? '仅译文' : '仅原文';
    $('fontValue').textContent = prefs.fontSize + 'px';
    $('opacityValue').textContent = Math.round(prefs.backgroundOpacity * 100) + '%';
    $('positionValue').textContent = prefs.position === 'top' ? '顶部' : '底部';
    var modeLabel = document.querySelector('#modeAction span:last-child');
    if (modeLabel) modeLabel.textContent = prefs.mode === 'bilingual' ? '双语' : prefs.mode === 'translation' ? '译文' : '原文';
    var buttons = document.querySelectorAll('#modeSegmented button');
    for (var i = 0; i < buttons.length; i++) buttons[i].classList.toggle('active', buttons[i].dataset.mode === prefs.mode);
    var posButtons = document.querySelectorAll('#positionSegmented button');
    for (var j = 0; j < posButtons.length; j++) posButtons[j].classList.toggle('active', posButtons[j].dataset.pos === prefs.position);
    $('fontRange').value = prefs.fontSize;
    $('opacityRange').value = Math.round(prefs.backgroundOpacity * 100);
    $('showOnVideoSwitch').classList.toggle('on', !!prefs.showOnVideo);
    $('transcriptSwitch').classList.toggle('on', !!prefs.transcript);
    updateSubtitleOverlay();
    renderTranscriptVisibility();
  }

  function renderTranscriptVisibility() {
    var inner = $('transcriptInner');
    if (!inner) return;
    if (!state.cues.length) {
      inner.innerHTML = '<div class="empty-cues">这个视频还没有可用字幕。<br>可以尝试在菜单里重新翻译，或换一个视频。</div>';
      return;
    }
    if (!state.prefs.transcript) return;
    if (inner.childElementCount === state.cues.length) return;
    inner.innerHTML = '';
    for (var i = 0; i < state.cues.length; i++) {
      var cue = state.cues[i];
      var el = document.createElement('div');
      el.className = 'cue';
      el.dataset.index = String(i);
      var orig = document.createElement('div');
      orig.className = 'orig';
      orig.textContent = cue.text || '';
      var trans = document.createElement('div');
      trans.className = 'trans';
      trans.textContent = cue.translation || '';
      el.appendChild(orig);
      el.appendChild(trans);
      el.addEventListener('click', function (event) {
        var index = Number(event.currentTarget.dataset.index);
        seekToCue(index);
      });
      inner.appendChild(el);
    }
    if (!state.cues.length) inner.innerHTML = '<div class="empty-cues">这个视频还没有可用字幕。</div>';
  }

  function seekToCue(index) {
    var cue = state.cues[index];
    if (!cue) return;
    if (player && player.seekTo) {
      player.seekTo(cue.start, true);
      if (state.playing && player.playVideo) player.playVideo();
    }
    state.current = cue.start;
    updateProgress();
    updateActiveCue(true);
  }

  function updateSubtitleOverlay(forceHide) {
    var overlay = $('subtitleOverlay');
    var prefs = state.prefs;
    var cue = state.cues[state.activeIndex];
    if (forceHide || state.orientation !== 'landscape' || !cue || !prefs.showOnVideo) {
      overlay.classList.remove('visible');
      return;
    }
    var original = forceHide ? '' : (cue.text || '');
    var translation = cue.translation || '';
    if (prefs.mode === 'original') translation = '';
    if (prefs.mode === 'translation') original = '';
    if (!original && !translation) {
      overlay.classList.remove('visible');
      return;
    }
    $('subOriginal').textContent = original;
    $('subTranslation').textContent = translation;
    overlay.classList.add('visible');
  }

  function updateActiveCue(force) {
    var t = state.current;
    var index = -1;
    for (var i = 0; i < state.cues.length; i++) {
      var cue = state.cues[i];
      if (cue.start <= t + 0.08 && t <= cue.end + 0.18) { index = i; break; }
      if (cue.start > t + 0.08) break;
    }
    if (index === state.activeIndex && !force) return;
    state.activeIndex = index;
    var children = $('transcriptInner').children;
    for (var k = 0; k < children.length; k++) {
      children[k].classList.toggle('active', k === index);
      children[k].classList.toggle('past', k < index);
    }
    if (index >= 0 && children[index]) {
      if (Date.now() > state.programmaticScrollUntil && Date.now() - state.userScrollAt > 4000 && state.prefs.transcript) {
        var transcript = $('transcript');
        var el = children[index];
        var target = el.offsetTop - transcript.clientHeight / 2 + el.clientHeight / 2;
        state.programmaticScrollUntil = Date.now() + 900;
        transcript.scrollTo({ top: target, behavior: 'smooth' });
      }
    }
    updateSubtitleOverlay();
  }

  function updateProgress() {
    var ratio = state.duration > 0 ? Math.min(1, state.current / state.duration) : 0;
    $('progressFill').style.width = (ratio * 100) + '%';
    $('progressThumb').style.left = (ratio * 100) + '%';
    $('timeNow').textContent = formatTime(state.current);
    $('currentTimeLabel').textContent = formatTime(state.current);
    $('timeTotal').textContent = formatTime(state.duration);
  }

  function updatePlayButton() {
    var icon = $('playIcon');
    var center = $('centerPlay');
    if (state.playing) {
      icon.innerHTML = '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/>';
      center.innerHTML = '&#10074;&#10074;';
    } else {
      icon.innerHTML = '<path d="M8 5.5v13l10-6.5-10-6.5z" fill="currentColor"/>';
      center.innerHTML = '&#9654;';
    }
  }

  function tick() {
    if (!player || typeof player.getCurrentTime !== 'function') return;
    try {
      var t = player.getCurrentTime() || 0;
      var d = player.getDuration() || 0;
      state.current = t;
      if (d > 0) state.duration = d;
      updateProgress();
      updateActiveCue(false);
      if (Date.now() - state.lastSent > 900) {
        state.lastSent = Date.now();
        send({ type: 'time', current: t, duration: d, playing: state.playing });
      }
      if (state.sleepAt && Date.now() > state.sleepAt) {
        state.sleepAt = 0;
        if (player.pauseVideo) player.pauseVideo();
        toast('睡眠定时已暂停播放');
        $('sleepHint').textContent = '关闭';
      }
    } catch (e) {}
  }

  function loadVideo() {
    if (!state.videoId) return;
    if (!ytReady) { state.pendingLoad = true; return; }
    if (!player) {
      player = new YT.Player('player', {
        videoId: state.videoId,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          iv_load_policy: 3,
          cc_load_policy: 0,
          enablejsapi: 1,
          origin: 'https://www.youtube.com',
          widget_referrer: 'https://www.youtube.com'
        },
        events: {
          onReady: function () {
            $('loading').style.display = 'none';
            state.duration = player.getDuration() || state.duration;
            updateProgress();
            send({ type: 'player-ready' });
            try { player.setVolume(100); } catch (e) {}
            try { player.setPlaybackQuality(state.quality); } catch (e) {}
          },
          onError: function () {
            showError('该视频不允许嵌入播放，或当前网络无法访问 YouTube。');
          },
          onStateChange: function (event) {
            state.playing = event.data === 1;
            updatePlayButton();
            if (state.playing) send({ type: 'playing', value: true });
            else send({ type: 'playing', value: false });
          },
          onError: function (event) {
            var code = event.data;
            var messages = {
              2: '视频参数无效。',
              5: '播放器发生错误，请重试。',
              100: '视频不存在或已被删除。',
              101: '视频所有者不允许嵌入播放。',
              150: '视频所有者不允许嵌入播放。'
            };
            showError(messages[code] || '视频无法播放。');
            send({ type: 'error', code: code });
          }
        }
      });
    } else if (player.loadVideoById) {
      player.loadVideoById(state.videoId);
    }
    state.pendingLoad = false;
    $('loading').style.display = 'flex';
    setTimeout(function () { if (!state.playing) $('loading').style.display = 'none'; }, 2200);
  }

  function showError(message) {
    $('loading').style.display = 'none';
    $('errorBox').classList.add('show');
    $('errorDesc').textContent = message;
    $('subtitleOverlay').classList.remove('visible');
  }

  window.KissPlayer = {
    load: function (payload) {
      if (!payload) return;
      state.videoId = payload.meta && payload.meta.videoId ? payload.meta.videoId : state.videoId;
      state.title = payload.meta && payload.meta.title ? payload.meta.title : 'YouTube';
      state.author = payload.meta && payload.meta.author ? payload.meta.author : '';
      state.duration = payload.meta && payload.meta.lengthSeconds ? Number(payload.meta.lengthSeconds) : 0;
      state.cues = Array.isArray(payload.cues) ? payload.cues : [];
      state.activeIndex = -1;
      state.current = 0;
      $('transcriptInner').innerHTML = '';
      if (payload.subtitle) state.prefs = Object.assign({}, state.prefs, payload.subtitle);
      if (payload.theme) applyTheme(payload.theme);
      $('title').innerHTML = '';
      $('title').appendChild(document.createTextNode(state.title));
      var sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = state.author;
      $('title').appendChild(sub);
      $('errorBox').classList.remove('show');
      $('loading').style.display = 'flex';
      applyPrefs();
      renderTranscriptVisibility();
      updateProgress();
      loadVideo();
      send({ type: 'loaded' });
    },
    setTheme: function (theme) { applyTheme(theme); },
    setFavorite: function (value) {
      var on = !!value;
      var buttons = ['favoriteBtn', 'favBtn'];
      for (var i = 0; i < buttons.length; i++) {
        var el = $(buttons[i]);
        if (el) el.classList.toggle('fav-on', on);
        if (el) el.textContent = on ? '\u2665' : '\u2661';
      }
    },
    setPrefs: function (prefs) { state.prefs = Object.assign({}, state.prefs, prefs || {}); applyPrefs(); },
    setOrientation: function (value) {
      document.body.setAttribute('data-orientation', value);
    },
    play: function () { if (player && player.playVideo) player.playVideo(); },
    pause: function () { if (player && player.pauseVideo) player.pauseVideo(); },
    seek: function (t) { if (player && player.seekTo) player.seekTo(t, true); },
    toast: function (text) { toast(text); },
    setCues: function (cues) {
      state.cues = cues || [];
      state.activeIndex = -1;
      $('transcriptInner').innerHTML = '';
      renderTranscriptVisibility();
      updateActiveCue(true);
    }
  };

  function onYouTubeIframeAPIReady() {
    ytReady = true;
    clearTimeout(apiTimer);
    if (state.pendingLoad || state.videoId) loadVideo();
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  (function loadApi() {
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = function () {
      showError('无法加载 YouTube 播放器，请检查网络或代理。');
      send({ type: 'error', code: 'api' });
    };
    document.head.appendChild(tag);
    apiTimer = setTimeout(function () {
      if (!ytReady && !player) {
        showError('YouTube 播放器加载超时，请检查网络或代理。');
      }
    }, 12000);
  })();

  function bindClick(id, handler) {
    var el = $(id);
    if (el) el.addEventListener('click', handler);
  }

  bindClick('backBtn', function () { send({ type: 'back' }); });
  bindClick('themeBtn', function () {
    applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    send({ type: 'theme', value: state.theme });
  });
  bindClick('playBtn', function () {
    if (!player) { loadVideo(); return; }
    if (state.playing) player.pauseVideo();
    else player.playVideo();
  });
  bindClick('centerPlay', function () {
    if (!player) { loadVideo(); return; }
    if (state.playing) player.pauseVideo();
    else player.playVideo();
  });
  bindClick('prevBtn', function () { previousCue(); });
  bindClick('centerPrev', function () { previousCue(); });
  bindClick('nextBtn', function () { nextCue(); });
  bindClick('centerNext', function () { nextCue(); });
  bindClick('fullBtn', function () {
    send({ type: 'fullscreen', value: state.orientation !== 'landscape' });
  });
  bindClick('speedBtn', function () { cycleSpeed(); });
  bindClick('speedAction', function () { cycleSpeed(); });
  bindClick('fullAction', function () {
    send({ type: 'fullscreen', value: state.orientation !== 'landscape' });
  });
  bindClick('modeAction', function () { cycleMode(); });
  bindClick('quickModeBtn', function () { cycleMode(); });
  bindClick('ccBtn', function () { cycleMode(); });
  bindClick('favBtn', function () {
    send({ type: 'favorite', videoId: state.videoId });
  });
  bindClick('exitFullBtn', function () {
    send({ type: 'fullscreen', value: false });
  });
  bindClick('styleAction', function () { openSheet(); });
  bindClick('audioAction', function () { send({ type: 'background-audio' }); toast('后台播放需要系统支持，当前仅保持屏幕常亮'); });
  bindClick('favoriteBtn', function () {
    send({ type: 'favorite', videoId: state.videoId });
  });
  bindClick('openExternalBtn', function () {
    send({ type: 'open-external', url: 'https://www.youtube.com/watch?v=' + state.videoId });
  });
  bindClick('sheetClose', function () { $('sheetMask').classList.remove('open'); });
  bindClick('menuBtn', function () { $('menuMask').classList.toggle('open'); });

  $('menuMask').addEventListener('click', function (event) {
    if (event.target === $('menuMask')) $('menuMask').classList.remove('open');
  });
  $('sheetMask').addEventListener('click', function (event) {
    if (event.target === $('sheetMask')) $('sheetMask').classList.remove('open');
  });

  var menuButtons = document.querySelectorAll('[data-menu]');
  for (var m = 0; m < menuButtons.length; m++) {
    menuButtons[m].addEventListener('click', function (event) {
      var action = event.currentTarget.dataset.menu;
      if (action === 'quality') cycleQuality();
      if (action === 'speed') cycleSpeed();
      if (action === 'translate') send({ type: 'retranslate' });
      if (action === 'external') send({ type: 'open-external', url: 'https://www.youtube.com/watch?v=' + state.videoId });
      if (action === 'copy') { send({ type: 'copy-link', url: 'https://www.youtube.com/watch?v=' + state.videoId }); toast('链接已复制'); }
      if (action === 'sleep') cycleSleep();
      $('menuMask').classList.remove('open');
    });
  }

  function cycleMode() {
    var modes = ['bilingual', 'translation', 'original'];
    var next = modes[(modes.indexOf(state.prefs.mode) + 1) % modes.length];
    state.prefs.mode = next;
    applyPrefs();
    send({ type: 'prefs', prefs: state.prefs });
  }
  function cycleSpeed() {
    var speeds = [0.75, 1, 1.25, 1.5, 2];
    var next = speeds[(speeds.indexOf(state.rate) + 1) % speeds.length];
    state.rate = next;
    try { if (player && player.setPlaybackRate) player.setPlaybackRate(next); } catch (e) {}
    var label = next.toFixed(2).replace(/0$/, '') + 'x';
    var speedBtn = $('speedBtn');
    var speedGlyph = $('speedGlyph');
    if (speedBtn) speedBtn.textContent = label;
    if (speedGlyph) speedGlyph.textContent = label;
    $('speedHint').textContent = label;
    toast('播放速度 ' + next + 'x');
  }
  function cycleQuality() {
    var qualities = ['default', 'hd720', 'hd1080'];
    var labels = { default: '自动', hd720: '720p', hd1080: '1080p' };
    var next = qualities[(qualities.indexOf(state.quality) + 1) % qualities.length];
    state.quality = next;
    try { if (player && player.setPlaybackQuality) player.setPlaybackQuality(next); } catch (e) {}
    $('qualityHint').textContent = labels[next];
    toast('画质：' + labels[next] + '（由 YouTube 播放器决定）');
  }
  function cycleSleep() {
    var options = [0, 15, 30, 60];
    var current = state.sleepAt ? Math.round((state.sleepAt - Date.now()) / 60000) : 0;
    var next = 0;
    for (var i = 0; i < options.length; i++) {
      if (options[i] > current) { next = options[i]; break; }
    }
    if (!next) {
      state.sleepAt = 0;
      $('sleepHint').textContent = '关闭';
      toast('睡眠定时已关闭');
      return;
    }
    state.sleepAt = Date.now() + next * 60000;
    $('sleepHint').textContent = next + ' 分钟';
    toast('将在 ' + next + ' 分钟后暂停');
  }
  function previousCue() {
    if (!state.cues.length) { seekBy(-10); return; }
    var index = state.activeIndex;
    var cue = state.cues[index];
    if (cue && state.current - cue.start > 1.2) { seekToCue(index); return; }
    seekToCue(Math.max(0, index - 1));
  }
  function nextCue() {
    if (!state.cues.length) { seekBy(10); return; }
    seekToCue(Math.min(state.cues.length - 1, state.activeIndex + 1));
  }
  function seekBy(delta) {
    var t = Math.max(0, Math.min(state.duration || 0, state.current + delta));
    if (player && player.seekTo) player.seekTo(t, true);
    state.current = t;
    updateProgress();
    updateActiveCue(true);
  }

  var dragging = false;
  function seekFromPointer(clientX) {
    var track = $('progressTrack');
    var rect = track.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    var t = ratio * state.duration;
    if (player && player.seekTo) player.seekTo(t, true);
    state.current = t;
    updateProgress();
    updateActiveCue(true);
  }
  $('progressTrack').addEventListener('pointerdown', function (event) {
    dragging = true;
    $('progressTrack').setPointerCapture(event.pointerId);
    seekFromPointer(event.clientX);
  });
  $('progressTrack').addEventListener('pointermove', function (event) {
    if (dragging) seekFromPointer(event.clientX);
  });
  $('progressTrack').addEventListener('pointerup', function () { dragging = false; });
  $('progressTrack').addEventListener('pointercancel', function () { dragging = false; });

  $('transcript').addEventListener('scroll', function () {
    if (Date.now() > state.programmaticScrollUntil) state.userScrollAt = Date.now();
  });

  function openSheet() {
    $('sheetMask').classList.add('open');
    applyPrefs();
  }
  $('fontRange').addEventListener('input', function (event) {
    state.prefs.fontSize = Number(event.target.value);
    applyPrefs();
    send({ type: 'prefs', prefs: state.prefs });
  });
  $('opacityRange').addEventListener('input', function (event) {
    state.prefs.backgroundOpacity = Number(event.target.value) / 100;
    applyPrefs();
    send({ type: 'prefs', prefs: state.prefs });
  });
  var modeBtns = document.querySelectorAll('#modeSegmented button');
  for (var b = 0; b < modeBtns.length; b++) {
    modeBtns[b].addEventListener('click', function (event) {
      state.prefs.mode = event.currentTarget.dataset.mode;
      applyPrefs();
      send({ type: 'prefs', prefs: state.prefs });
    });
  }
  var posBtns = document.querySelectorAll('#positionSegmented button');
  for (var p = 0; p < posBtns.length; p++) {
    posBtns[p].addEventListener('click', function (event) {
      state.prefs.position = event.currentTarget.dataset.pos;
      applyPrefs();
      send({ type: 'prefs', prefs: state.prefs });
    });
  }
  $('showOnVideoSwitch').addEventListener('click', function () {
    state.prefs.showOnVideo = !state.prefs.showOnVideo;
    applyPrefs();
    send({ type: 'prefs', prefs: state.prefs });
  });
  $('transcriptSwitch').addEventListener('click', function () {
    state.prefs.transcript = !state.prefs.transcript;
    applyPrefs();
    renderTranscriptVisibility();
    send({ type: 'prefs', prefs: state.prefs });
  });

  window.addEventListener('resize', syncOrientation);
  syncOrientation();
  applyTheme(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyPrefs();
  setInterval(tick, 260);
  send({ type: 'ready' });
})();
</script>
</body>
</html>
